name: First Contribution Welcome

on:
  issues:
    types: [opened]

  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome first-time contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPR = Boolean(context.payload.pull_request);

            const author = isPR
              ? context.payload.pull_request.user.login
              : context.payload.issue.user.login;

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const currentNumber = context.issue.number;

            // Build search query for both issues and PRs
            const query = `repo:${repo} author:${author}`;

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: query
            });

            // Exclude the current issue/PR
            const previousItems = data.items.filter(
              item => item.number !== currentNumber
            );

            // If this is the first interaction (issue or PR)
            if (previousItems.length === 0) {
              const imageUrl =
                "https://raw.githubusercontent.com/Vatsal-Verma/testing-/main/.github/images/welcome.svg";

              const message = isPR
                ? `🎉 **Welcome @${author}!**

                Thanks for submitting your **first Pull Request** to this repository 🚀  
                
                We really appreciate you taking the time to contribute.  
                A maintainer will review your PR soon.
                
                ![Welcome](${imageUrl})
                `
                                : `👋 **Hi @${author}, welcome!**
                
                Thanks for opening your **first issue** 🎉  
                
                Your feedback and ideas help make this project better.  
                A maintainer will take a look shortly.
                
                ![Welcome](${imageUrl})
                `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentNumber,
                body: message
              });
            }
